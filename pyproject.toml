[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "st-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.6.1",
    "groq>=1.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas",
    "python-dotenv>=1.2.4",
    "requests",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
